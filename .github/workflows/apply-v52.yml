name: Apply V52 medium gray KOCS
on:
  push:
    paths:
      - '.github/workflows/apply-v52.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V52
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v52-medium-gray-kocs">
          .name .bottom{color:#8f9396!important;text-shadow:none!important}
          </style>'''
          if 'id="v52-medium-gray-kocs"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V52
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V52: set KOCS to medium gray" || exit 0
          git push
