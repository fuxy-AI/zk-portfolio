name: Apply V17 typography refinement
on:
  push:
    paths:
      - '.github/workflows/apply-v17.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine hero typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.name{font-size:clamp(64px,7.4vw,130px);line-height:.76;font-weight:980;letter-spacing:-.068em;text-transform:uppercase;margin-top:-34px}', '.name{font-size:clamp(64px,7.4vw,130px);line-height:.80;font-weight:980;letter-spacing:-.068em;text-transform:uppercase;margin-top:-34px}')
          s=s.replace('.name .bottom{color:#3f4143;animation:driftB 7s ease-in-out infinite alternate;margin-top:4px;margin-left:0}', '.name .bottom{color:#3f4143;animation:driftB 7s ease-in-out infinite alternate;margin-top:10px;margin-left:0}')
          s=s.replace('.role b{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;color:var(--accent);font-weight:900;letter-spacing:-.035em}', '.role b{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;color:#e85a2a;font-weight:900;letter-spacing:-.035em}')
          old='.role .artist{font-family:"Helvetica Neue","Arial Narrow","Roboto Condensed",Arial,sans-serif;font-stretch:condensed;font-weight:250;color:transparent;-webkit-text-stroke:.9px rgba(255,243,223,.72);text-stroke:.9px rgba(255,243,223,.72);letter-spacing:-.055em;line-height:.92;transform:scaleX(.86);transform-origin:left bottom;padding:0 .02em;overflow:visible}'
          new='.role .artist{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:100;color:rgba(255,243,223,.76);-webkit-text-stroke:0;text-stroke:0;letter-spacing:-.075em;line-height:.88;transform:scaleX(.78);transform-origin:left bottom;padding:0;overflow:visible}'
          s=s.replace(old,new)
          s=s.replace('.ambient-physics{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.66;mix-blend-mode:screen;filter:blur(7px)}', '.ambient-physics{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.54;mix-blend-mode:screen;filter:blur(7px)}')
          s=s.replace('.stage:before,.stage:after{opacity:.40}', '.stage:before,.stage:after{opacity:.32}')
          p.write_text(s)
          PY
      - name: Commit V17
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V17: refine name spacing and thin Artist typography" || exit 0
          git push
