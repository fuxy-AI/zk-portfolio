name: Apply V57 robust header logo fix
on:
  push:
    paths:
      - '.github/workflows/apply-v57.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix visible header logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Remove any previous failed V56 injected logo/style if present.
          s=re.sub(r'<span class="header-fox".*?</span>','',s,count=1,flags=re.S)
          s=re.sub(r'<style id="v56-header-logo">.*?</style>','',s,count=1,flags=re.S)
          fox='''<span class="header-fox" aria-label="KZ fox logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path fill="#151719" d="M5 7 21 21h22L59 7l-5 29 6 8-10 8-18 9-18-9L4 44l6-8Z"/><path fill="#ff5a00" d="M10 13 24 25h16l14-12-5 24 6 7-10 5-7 7-6-3-6 3-7-7-10-5 6-7Z"/><path fill="#17191a" d="m15 19 9 8-7 9Zm34 0-9 8 7 9ZM20 38l10 3-7 2Zm24 0-10 3 7 2Z"/><path fill="#f7f7f5" d="m12 44 13 7 7 9-14-8Zm40 0-13 7-7 9 14-8Z"/></svg></span>'''
          # Target the actual .brand element instead of replacing text.
          m=re.search(r'(<[^>]+class=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>)',s,re.I)
          if not m:
              raise SystemExit('Brand element not found')
          pos=m.end()
          s=s[:pos]+fox+s[pos:]
          css='''<style id="v57-header-logo">
          .brand{display:flex!important;align-items:center!important}
          .header-fox{display:inline-flex!important;width:38px!important;height:38px!important;min-width:38px!important;margin-right:11px!important;align-items:center!important;justify-content:center!important;opacity:1!important;visibility:visible!important;transition:transform .28s ease,filter .28s ease}
          .header-fox svg{display:block!important;width:38px!important;height:38px!important;overflow:visible!important}
          .brand:hover .header-fox{transform:scale(1.02);filter:drop-shadow(0 0 8px rgba(255,90,0,.42))}
          @media(max-width:720px){.header-fox{width:30px!important;height:30px!important;min-width:30px!important;margin-right:8px!important}.header-fox svg{width:30px!important;height:30px!important}}
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V57
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V57: reliably insert visible fox logo into header brand" || exit 0
          git push
