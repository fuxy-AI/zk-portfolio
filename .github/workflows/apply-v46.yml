name: Apply V46 hero label cleanup and KOCS lemon color
on:
  push:
    paths:
      - '.github/workflows/apply-v46.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V46
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v46-hero-cleanup-kocs-color">
          .hero .card .tag{display:none!important}
          .name .bottom{color:#d9d45a!important;text-shadow:0 0 18px rgba(217,212,90,.07)!important}
          </style>'''
          if 'id="v46-hero-cleanup-kocs-color"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V46
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V46: remove hero card labels and recolor KOCS lemon yellow" || exit 0
          git push
