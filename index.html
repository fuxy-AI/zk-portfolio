<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kócs Zoltán — 3D Portfolio Preview</title><style id="v42-uniform-faces">
/* Remove the depth gradient from V41 and keep both readable faces equally crisp. */
.role3d-layer{filter:none!important;color:#9f442b!important;text-shadow:none!important}
.role3d-layer.front,.role3d-layer.back{
  color:var(--accent)!important;
  filter:none!important;
  -webkit-text-stroke:.35px rgba(255,190,155,.28);
  text-shadow:0 0 0.01px rgba(255,255,255,.01)!important
}
</style></head><body><script>
fetch('base.html?v=showreel-preview').then(r=>r.text()).then(html=>{
  html=html.replace('<a href="#about">ABOUT</a><a href="#contact">CONTACT</a>','<a href="#about">ABOUT</a><a href="#showreel">SHOWREEL</a><a href="#contact">CONTACT</a>');
  const showreel=`<section id="showreel" class="section section-anchor showreel-section"><div class="eyebrow">SHOWREEL</div><h2>Selected 3D Work</h2><p class="lead">A focused selection of my 3D work across modeling, texturing, look development, shading and final presentation.</p><div class="showreel-frame"><iframe src="https://www.youtube.com/embed/YmtCGnmd5ZM?rel=0" title="Kócs Zoltán 3D Showreel" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><p class="showreel-note">Press play to watch the reel directly on the site.</p></section>`;
  html=html.replace('<section id="contact" class="section section-anchor">',showreel+'<section id="contact" class="section section-anchor">');
  const css=`<style id="showreel-preview-style">.showreel-section{scroll-margin-top:var(--header);min-height:auto}.showreel-section .eyebrow{transform:none;margin-bottom:22px}.showreel-frame{width:min(1120px,100%);aspect-ratio:16/9;margin-top:42px;border:1px solid rgba(217,102,62,.36);background:#050708;box-shadow:0 24px 60px rgba(0,0,0,.42),0 0 28px rgba(217,102,62,.08);overflow:hidden}.showreel-frame iframe{width:100%;height:100%;border:0;display:block}.showreel-note{margin-top:14px;color:#767d82;font-size:12px;letter-spacing:.04em}@media(max-width:720px){.showreel-frame{margin-top:28px}}</style>`;
  html=html.replace('</head>',css+'</head>');
  document.open();document.write(html);document.close();
}).catch(err=>{document.body.innerHTML='<pre style="color:white;background:#050708;padding:24px">Preview load error: '+err+'</pre>';});
</script></body></html>
