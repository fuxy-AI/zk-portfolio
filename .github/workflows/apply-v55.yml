name: Apply V55 interactive hero lightbox
on:
  push:
    paths:
      - '.github/workflows/apply-v55.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V55
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v55-lightbox-style">
          .hero .card{cursor:zoom-in}
          .v55-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(5,6,7,.94);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;overflow:hidden;user-select:none}
          .v55-lightbox.open{display:flex}
          .v55-lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;transform-origin:center center;will-change:transform;cursor:grab;box-shadow:0 24px 80px rgba(0,0,0,.45)}
          .v55-lightbox.dragging img{cursor:grabbing}
          .v55-close,.v55-prev,.v55-next,.v55-reset{position:absolute;z-index:2;border:1px solid rgba(255,255,255,.16);background:rgba(12,13,14,.62);color:#fff;backdrop-filter:blur(10px);cursor:pointer;transition:.2s ease}
          .v55-close:hover,.v55-prev:hover,.v55-next:hover,.v55-reset:hover{background:rgba(217,102,62,.18);border-color:rgba(217,102,62,.7)}
          .v55-close{top:24px;right:28px;width:44px;height:44px;border-radius:50%;font-size:26px;line-height:1}
          .v55-prev,.v55-next{top:50%;transform:translateY(-50%);width:46px;height:68px;border-radius:12px;font-size:28px}
          .v55-prev{left:24px}.v55-next{right:24px}
          .v55-reset{left:50%;bottom:22px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;font:600 11px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}
          @media(max-width:700px){.v55-prev{left:10px}.v55-next{right:10px}.v55-close{top:14px;right:14px}.v55-lightbox img{max-width:96vw;max-height:84vh}}
          </style>'''
          js='''<script id="v55-lightbox-script">
          (()=>{
            const cards=[...document.querySelectorAll('.hero .card img')];
            if(!cards.length) return;
            const box=document.createElement('div');
            box.className='v55-lightbox';
            box.innerHTML='<button class="v55-close" aria-label="Close">×</button><button class="v55-prev" aria-label="Previous">‹</button><img alt="Portfolio render"><button class="v55-next" aria-label="Next">›</button><button class="v55-reset">Reset view</button>';
            document.body.appendChild(box);
            const img=box.querySelector('img');
            const close=box.querySelector('.v55-close');
            const prev=box.querySelector('.v55-prev');
            const next=box.querySelector('.v55-next');
            const reset=box.querySelector('.v55-reset');
            let index=0,scale=1,x=0,y=0,drag=false,sx=0,sy=0,bx=0,by=0;
            const apply=()=>img.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
            const resetView=()=>{scale=1;x=0;y=0;apply()};
            const show=i=>{index=(i+cards.length)%cards.length;img.src=cards[index].currentSrc||cards[index].src;img.alt=cards[index].alt||'Portfolio render';resetView();box.classList.add('open');document.documentElement.style.overflow='hidden'};
            const hide=()=>{box.classList.remove('open');document.documentElement.style.overflow='';resetView()};
            cards.forEach((el,i)=>el.closest('.card').addEventListener('click',e=>{e.preventDefault();show(i)}));
            close.addEventListener('click',hide);
            prev.addEventListener('click',e=>{e.stopPropagation();show(index-1)});
            next.addEventListener('click',e=>{e.stopPropagation();show(index+1)});
            reset.addEventListener('click',e=>{e.stopPropagation();resetView()});
            box.addEventListener('click',e=>{if(e.target===box)hide()});
            box.addEventListener('wheel',e=>{
              e.preventDefault();
              const old=scale;
              scale=Math.min(6,Math.max(1,scale*(e.deltaY<0?1.12:.89)));
              if(scale===1){x=0;y=0}else{
                const r=img.getBoundingClientRect();
                const cx=e.clientX-(r.left+r.width/2), cy=e.clientY-(r.top+r.height/2);
                const ratio=scale/old;
                x-=cx*(ratio-1); y-=cy*(ratio-1);
              }
              apply();
            },{passive:false});
            img.addEventListener('mousedown',e=>{
              if(scale<=1)return;
              drag=true;box.classList.add('dragging');sx=e.clientX;sy=e.clientY;bx=x;by=y;e.preventDefault();
            });
            window.addEventListener('mousemove',e=>{if(!drag)return;x=bx+(e.clientX-sx);y=by+(e.clientY-sy);apply()});
            window.addEventListener('mouseup',()=>{drag=false;box.classList.remove('dragging')});
            document.addEventListener('keydown',e=>{
              if(!box.classList.contains('open'))return;
              if(e.key==='Escape')hide();
              if(e.key==='ArrowLeft')show(index-1);
              if(e.key==='ArrowRight')show(index+1);
              if(e.key==='0')resetView();
            });
          })();
          </script>'''
          if 'id="v55-lightbox-style"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          if 'id="v55-lightbox-script"' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s)
          PY
      - name: Commit V55
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V55: add zoomable draggable lightbox for hero cards" || exit 0
          git push
