name: Apply V56 header fox logo
on:
  push:
    paths:
      - '.github/workflows/apply-v56.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add header logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Use a small inline SVG rendition matching the supplied fox mark, avoiding another binary asset dependency.
          logo='''<span class="header-fox" aria-hidden="true"><svg viewBox="0 0 64 64" role="img"><path class="fox-shadow" d="M7 8 22 21h20L57 8l-4 27 5 8-8 7-18 9-18-9-8-7 5-8Z"/><path class="fox-orange" d="M11 13 24 25h16l13-12-4 24 5 6-9 5-7 7-6-3-6 3-7-7-9-5 5-6Z"/><path class="fox-ear" d="m15 18 8 8-6 8Zm34 0-8 8 6 8Z"/><path class="fox-eye" d="m20 37 9 3-6 1Zm24 0-9 3 6 1Z"/><path class="fox-white" d="m13 44 12 7 7 8-13-7Zm38 0-12 7-7 8 13-7Z"/></svg></span>'''
          if 'class="header-fox"' not in s:
              # Insert immediately before the visible KZ/3D PORTFOLIO brand text.
              s=s.replace('KZ/3D PORTFOLIO',logo+'KZ/3D PORTFOLIO',1)
          css='''<style id="v56-header-logo">
          .header-fox{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:9px;vertical-align:middle;transition:transform .28s ease,filter .28s ease;filter:drop-shadow(0 0 0 rgba(217,102,62,0))}
          .header-fox svg{width:100%;height:100%;display:block;overflow:visible}
          .header-fox .fox-shadow{fill:#151617}.header-fox .fox-orange{fill:#ff5a00}.header-fox .fox-ear,.header-fox .fox-eye{fill:#171819}.header-fox .fox-white{fill:#f5f5f3}
          .brand:hover .header-fox,.logo:hover .header-fox,header a:hover .header-fox{transform:scale(1.02);filter:drop-shadow(0 0 7px rgba(255,90,0,.34))}
          </style>'''
          if 'id="v56-header-logo"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V56
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V56: add fox mark beside portfolio brand" || exit 0
          git push
