name: Apply V51 three-quarter gray KOCS
on:
  push:
    paths:
      - '.github/workflows/apply-v51.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V51
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v51-kocs-three-quarter-gray">
          .name .bottom{color:#b9b9b6!important;text-shadow:none!important}
          </style>'''
          if 'id="v51-kocs-three-quarter-gray"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V51
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V51: set KOCS to three-quarter gray" || exit 0
          git push
