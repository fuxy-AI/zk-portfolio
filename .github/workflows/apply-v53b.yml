name: Apply V53b reference card motion
on:
  push:
    paths:
      - '.github/workflows/apply-v53b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply motion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v53b-card-motion">
          .hero .card.c1{animation:cardFloatA 9s ease-in-out infinite alternate!important}
          .hero .card.c2{animation:cardFloatB 11s ease-in-out infinite alternate!important}
          .hero .card.c3{animation:cardFloatC 10s ease-in-out infinite alternate!important}
          .hero .card.c4{animation:cardFloatD 12s ease-in-out infinite alternate!important}
          .hero .card.c5{animation:cardFloatE 10.5s ease-in-out infinite alternate!important}
          @keyframes cardFloatA{from{translate:0 0}to{translate:5px -7px}}
          @keyframes cardFloatB{from{translate:0 0}to{translate:-6px 5px}}
          @keyframes cardFloatC{from{translate:0 0}to{translate:4px 7px}}
          @keyframes cardFloatD{from{translate:0 0}to{translate:6px -4px}}
          @keyframes cardFloatE{from{translate:0 0}to{translate:-5px -6px}}
          </style>'''
          if 'id="v53b-card-motion"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V53b: add subtle floating motion to reference cards" || exit 0
          git push
