name: Apply V45 slightly faster brighter ambient lights
on:
  push:
    paths:
      - '.github/workflows/apply-v45.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V45
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v45-ambient-tune">
          .ambient-physics{opacity:.78!important;filter:blur(2px)!important}
          </style>'''
          if 'id="v45-ambient-tune"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          s=s.replace('const speed=.005+Math.random()*.009;','const speed=.0056+Math.random()*.0101;',1)
          p.write_text(s)
          PY
      - name: Commit V45
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V45: slightly speed up and sharpen ambient lights" || exit 0
          git push
