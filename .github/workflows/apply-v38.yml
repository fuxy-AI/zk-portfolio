name: Apply V38 cool slate KOCS
on:
  push:
    paths:
      - '.github/workflows/apply-v38.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V38
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          fix='''<style id="v38-kocs-color">
          /* Cool graphite/slate balances the warm orange accents without competing with them. */
          .name .bottom{color:#718087!important;text-shadow:0 0 18px rgba(113,128,135,.08)}
          </style>'''
          if 'id="v38-kocs-color"' not in s:
              s=s.replace('</head>',fix+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V38
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V38: change KOCS to cool graphite slate" || exit 0
          git push
