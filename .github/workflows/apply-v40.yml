name: Apply V40 horizontal-axis 3D spin
on:
  push:
    paths:
      - '.github/workflows/apply-v40.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V40
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          fix='''<style id="v40-role-3d-horizontal-spin">
          .role{perspective:760px;perspective-origin:8% 50%}
          .role b{
            position:relative;
            display:inline-block;
            transform-style:preserve-3d;
            transform-origin:50% 52%;
            animation:v40Spin3D 6.8s linear infinite!important;
            text-shadow:
              0 1px 0 #c85a37,
              0 2px 0 #b84e2e,
              0 3px 0 #9d4128,
              0 4px 0 #7d3422,
              0 6px 13px rgba(0,0,0,.34);
          }
          .role b::before{
            content:"3D";
            position:absolute;
            inset:0;
            color:var(--accent);
            font:inherit;
            letter-spacing:inherit;
            line-height:inherit;
            transform:rotateX(180deg) translateZ(8px);
            backface-visibility:hidden;
            text-shadow:
              0 -1px 0 #c85a37,
              0 -2px 0 #b84e2e,
              0 -3px 0 #9d4128,
              0 -4px 0 #7d3422;
            pointer-events:none;
          }
          .role b{
            backface-visibility:hidden;
          }
          @keyframes v40Spin3D{
            from{transform:rotateX(0deg)}
            to{transform:rotateX(360deg)}
          }
          @media (prefers-reduced-motion:reduce){.role b{animation:none!important}.role b::before{display:none}}
          </style>'''
          if 'id="v40-role-3d-horizontal-spin"' not in s:
              s=s.replace('</head>',fix+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V40
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V40: horizontal-axis 3D spin with depth and readable reverse face" || exit 0
          git push
