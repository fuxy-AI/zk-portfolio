name: Apply V22 collage position refinement
on:
  push:
    paths:
      - '.github/workflows/apply-v22.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shift hero collage left
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.stage{height:min(650px,67vh);min-height:500px;position:relative;isolation:isolate;max-width:930px;margin-left:-4vw;margin-right:1vw;width:112%}', '.stage{height:min(650px,67vh);min-height:500px;position:relative;isolation:isolate;max-width:930px;margin-left:-16vw;margin-right:1vw;width:112%}')
          p.write_text(s)
          PY
      - name: Commit V22
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V22: shift hero collage further left" || exit 0
          git push
