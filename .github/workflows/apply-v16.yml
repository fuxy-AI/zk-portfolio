name: Apply V16 typography patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Add V16 typography patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero typography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('.name{font-size:clamp(64px,7.4vw,130px);line-height:.82;font-weight:950;letter-spacing:-.065em;text-transform:uppercase;margin-top:-34px}.name .top,.name .bottom{display:block;will-change:transform}.name .top{color:#3f4143;animation:driftA 7s ease-in-out infinite alternate}.name .bottom{color:#fff3df;animation:driftB 7s ease-in-out infinite alternate;margin-left:.5ch}', '.name{font-size:clamp(64px,7.4vw,130px);line-height:.76;font-weight:980;letter-spacing:-.068em;text-transform:uppercase;margin-top:-34px}.name .top,.name .bottom{display:block;will-change:transform}.name .top{color:#fff3df;animation:driftA 7s ease-in-out infinite alternate}.name .bottom{color:#3f4143;animation:driftB 7s ease-in-out infinite alternate;margin-top:4px;margin-left:0}')
          s = s.replace('.role{margin-top:18px;font-size:clamp(44px,4.8vw,86px);line-height:.9;letter-spacing:-.035em;display:flex;align-items:baseline;gap:.16em;font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;font-stretch:condensed}.role b{color:var(--accent);font-weight:900}.role .artist{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;font-stretch:condensed;font-weight:900;color:transparent;-webkit-text-stroke:1.2px rgba(255,243,223,.72);text-stroke:1.2px rgba(255,243,223,.72);letter-spacing:.005em;line-height:1;padding:0 .035em;overflow:visible}', '.role{margin-top:16px;font-size:clamp(46px,5.15vw,92px);line-height:.88;letter-spacing:-.045em;display:flex;align-items:baseline;gap:.09em}.role b{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;color:var(--accent);font-weight:900;letter-spacing:-.035em}.role .artist{font-family:"Helvetica Neue","Arial Narrow","Roboto Condensed",Arial,sans-serif;font-stretch:condensed;font-weight:250;color:transparent;-webkit-text-stroke:.9px rgba(255,243,223,.72);text-stroke:.9px rgba(255,243,223,.72);letter-spacing:-.055em;line-height:.92;transform:scaleX(.86);transform-origin:left bottom;padding:0 .02em;overflow:visible}')
          s = s.replace('<div class="name"><span class="top">KÓCS</span><span class="bottom">ZOLTÁN</span></div>', '<div class="name"><span class="top">ZOLTÁN</span><span class="bottom">KÓCS</span></div>')
          s = s.replace('opacity:.58;mix-blend-mode:screen;filter:blur(7px)', 'opacity:.66;mix-blend-mode:screen;filter:blur(7px)')
          s = s.replace('.stage:before,.stage:after{opacity:.34}', '.stage:before,.stage:after{opacity:.40}')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v16.yml
          git add index.html
          git commit -m "V16: refine hero typography and strengthen ambient lights"
          git push
