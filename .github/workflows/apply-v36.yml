name: Apply V36 definitive stacked name fix
on:
  push:
    paths:
      - '.github/workflows/apply-v36.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # V35 accidentally replaced the shared selector with bottom-line declarations,
          # removing display:block. Append a definitive override after all existing CSS.
          fix='''<style id="v36-name-fix">
          .name{font-family:"Anton",Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(64px,7.4vw,130px);line-height:.68;font-weight:400;letter-spacing:-.045em;text-transform:uppercase;margin-top:-34px}
          .name .top,.name .bottom{display:block!important;width:max-content;transform:scaleY(.82);transform-origin:left center;will-change:transform}
          .name .top{color:#fff3df;margin:0!important;animation:v36DriftTop 8s ease-in-out infinite alternate!important}
          .name .bottom{color:#3f4143;margin:8px 0 0 0!important;animation:v36DriftBottom 8s ease-in-out infinite alternate!important}
          @keyframes v36DriftTop{from{transform:scaleY(.82) translateX(0)}to{transform:scaleY(.82) translateX(4px)}}
          @keyframes v36DriftBottom{from{transform:scaleY(.82) translateX(0)}to{transform:scaleY(.82) translateX(-4px)}}
          </style>'''
          if 'id="v36-name-fix"' not in s:
              s=s.replace('</head>',fix+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V36
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V36: force ZOLTAN above KOCS and restore subtle drift" || exit 0
          git push
