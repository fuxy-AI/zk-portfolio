name: Apply V42 uniform 3D faces
on:
  push:
    paths:
      - '.github/workflows/apply-v42.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V42
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v42-uniform-faces">
          /* Remove the depth gradient from V41 and keep both readable faces equally crisp. */
          .role3d-layer{filter:none!important;color:#9f442b!important;text-shadow:none!important}
          .role3d-layer.front,.role3d-layer.back{
            color:var(--accent)!important;
            filter:none!important;
            -webkit-text-stroke:.35px rgba(255,190,155,.28);
            text-shadow:0 0 0.01px rgba(255,255,255,.01)!important
          }
          </style>'''
          if 'id="v42-uniform-faces"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V42
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V42: make front and back 3D faces equally crisp" || exit 0
          git push
