name: Apply V28 exact role typography
on:
  push:
    paths:
      - '.github/workflows/apply-v28.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V28 role typography
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Match supplied crop: blocky heavy orange 3D + tall geometric hairline ARTIST.
          s=re.sub(r'\.role\{[^}]*\}', '.role{margin-top:18px;font-size:clamp(46px,5vw,88px);line-height:.88;display:flex;align-items:center;gap:.20em;white-space:nowrap}', s, count=1)
          s=re.sub(r'\.role b\{[^}]*\}', '.role b{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;color:var(--accent);font-weight:900;letter-spacing:-.055em;line-height:.88;transform:scaleX(.94);transform-origin:left center}', s, count=1)
          s=re.sub(r'\.role \.artist\{[^}]*\}', '.role .artist{font-family:"Helvetica Neue",Helvetica,"Arial Narrow",Arial,sans-serif;font-weight:100;color:rgba(255,255,255,.82);letter-spacing:-.075em;line-height:.9;transform:scaleX(.56);transform-origin:left center;-webkit-text-stroke:.15px rgba(255,255,255,.28);text-stroke:.15px rgba(255,255,255,.28);padding:0;overflow:visible}', s, count=1)
          p.write_text(s)
          PY
      - name: Commit V28
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V28: match supplied 3D ARTIST typography reference" || exit 0
          git push
