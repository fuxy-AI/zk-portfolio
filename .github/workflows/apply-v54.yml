name: Apply V54 high quality hero renders
on:
  push:
    paths:
      - '.github/workflows/apply-v54.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V54
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          picks=['KshatriyaA.jpg','KshatriyaC.jpg','KshatriyaD.jpg','KshatriyaF.jpg','KshatriyaH.jpg']
          for i,name in enumerate(picks,1):
              pattern=r'(<figure class="card c%d"[^>]*>\s*<img[^>]*src=")[^"]+("[^>]*>)' % i
              s,n=re.subn(pattern,lambda m:m.group(1)+'assets/'+name+m.group(2),s,count=1)
              if not n:
                  print('card',i,'image pattern not found')
          p.write_text(s)
          PY
      - name: Commit V54
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V54: use high quality Kshatriya renders in all five hero cards" || exit 0
          git push
