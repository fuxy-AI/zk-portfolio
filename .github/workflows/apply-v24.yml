name: Apply V24 stronger ambient lights
on:
  push:
    paths:
      - '.github/workflows/apply-v24.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V24 ambient treatment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          # Increase visibility and reduce blur so the moving light orbs have a clearer contour,
          # while keeping them behind the portfolio content.
          import re
          s=re.sub(r'(\.ambient-physics\{[^}]*?)opacity:\s*[.0-9]+;', r'\1opacity:.48;', s, count=1)
          s=re.sub(r'(\.ambient-physics\{[^}]*?)filter:blur\([^)]*\)', r'\1filter:blur(6px)', s, count=1)
          # Bring back a little of the local collage glow as well.
          s=re.sub(r'\.stage:before,\.stage:after\{opacity:[^}]+\}', '.stage:before,.stage:after{opacity:.26}', s, count=1)
          p.write_text(s)
          PY
      - name: Commit V24
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V24: strengthen and define ambient light orbs" || exit 0
          git push
