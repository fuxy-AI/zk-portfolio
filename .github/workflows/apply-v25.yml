name: Apply V25 brighter defined ambient lights
on:
  push:
    paths:
      - '.github/workflows/apply-v25.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V25 ambient refinement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # One additional restrained step up from V24: brighter and slightly more defined.
          s=re.sub(r'(\.ambient-physics\{[^}]*?)opacity:\s*[.0-9]+;', r'\1opacity:.58;', s, count=1)
          s=re.sub(r'(\.ambient-physics\{[^}]*?)filter:blur\([^)]*\)', r'\1filter:blur(4px)', s, count=1)
          s=re.sub(r'\.stage:before,\.stage:after\{opacity:[^}]+\}', '.stage:before,.stage:after{opacity:.31}', s, count=1)
          p.write_text(s)
          PY
      - name: Commit V25
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V25: brighten and sharpen ambient light spots" || exit 0
          git push
