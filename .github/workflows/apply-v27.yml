name: Apply V27 reference matched hero
on:
  push:
    paths:
      - '.github/workflows/apply-v27.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V27
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Match the supplied reference: compact bold orange 3D, very thin ARTIST.
          s=re.sub(r'\.role\{[^}]*\}', '.role{margin-top:18px;font-size:clamp(44px,4.7vw,84px);line-height:.9;display:flex;align-items:flex-start;gap:.16em;white-space:nowrap}', s, count=1)
          s=re.sub(r'\.role b\{[^}]*\}', '.role b{font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Narrow",sans-serif;color:var(--accent);font-weight:900;letter-spacing:-.045em;line-height:.9}', s, count=1)
          s=re.sub(r'\.role \.artist\{[^}]*\}', '.role .artist{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:100;color:rgba(255,255,255,.78);letter-spacing:-.065em;line-height:.9;transform:scaleX(.62);transform-origin:left top;-webkit-text-stroke:0;text-stroke:0;padding:0;overflow:visible}', s, count=1)
          # Center the complete five-card composition in the available right-hand visual area,
          # between the left text column and the right viewport edge.
          s=re.sub(r'\.stage\{height:min\(650px,67vh\);min-height:500px;position:relative;isolation:isolate;max-width:930px;[^}]*\}', '.stage{height:min(650px,67vh);min-height:500px;position:relative;isolation:isolate;max-width:930px;width:108%;margin-left:-3vw;margin-right:3vw;transform:translateX(-2vw)}', s, count=1)
          p.write_text(s)
          PY
      - name: Commit V27
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V27: match 3D ARTIST reference and center five-card collage" || exit 0
          git push
