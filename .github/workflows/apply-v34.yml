name: Apply V34 compact blocky name
on:
  push:
    paths:
      - '.github/workflows/apply-v34.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V34
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # Keep the name's horizontal footprint, but make it denser/blockier and vertically compressed.
          s=re.sub(r'\.name\{[^}]*\}', '.name{font-family:"Anton",Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:clamp(64px,7.4vw,130px);line-height:.68;font-weight:400;letter-spacing:-.045em;text-transform:uppercase;margin-top:-34px;transform:scaleY(.82);transform-origin:left center}', s, count=1)
          # Tighten the two rows to suit the compressed display type.
          s=re.sub(r'\.name \.bottom\{[^}]*\}', '.name .bottom{color:#3f4143;animation:driftB 7s ease-in-out infinite alternate;margin-top:13px;margin-left:0}', s, count=1)
          p.write_text(s)
          PY
      - name: Commit V34
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V34: make KOCS ZOLTAN denser and vertically compact" || exit 0
          git push
