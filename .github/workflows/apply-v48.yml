name: Apply V48 dark orange KOCS
on:
  push:
    paths:
      - '.github/workflows/apply-v48.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V48
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''<style id="v48-dark-orange-kocs">
          .name .bottom{color:#a84b2d!important;text-shadow:0 0 18px rgba(168,75,45,.07)!important}
          </style>'''
          if 'id="v48-dark-orange-kocs"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Commit V48
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V48: change KOCS to dark orange" || exit 0
          git push
