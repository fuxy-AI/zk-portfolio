name: Apply V59 exact fox logo asset to header
on:
  push:
    paths:
      - '.github/workflows/apply-v59.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert exact logo asset into header brand
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          # remove any earlier failed injected fox element
          s=re.sub(r'<span class="header-fox".*?</span>','',s,count=1,flags=re.S)
          s=re.sub(r'<img class="header-fox-img"[^>]*>','',s,count=1,flags=re.S)
          needle='<a class="brand" href="#work">'
          if needle not in s:
              raise SystemExit('Exact brand anchor not found')
          logo='<img class="header-fox-img" src="assets/kz-fox-logo.png" alt="KZ fox logo">'
          s=s.replace(needle,needle+logo,1)
          css='''<style id="v59-header-fox-img">
          .brand{display:flex!important;align-items:center!important}
          .header-fox-img{display:block!important;width:38px!important;height:38px!important;object-fit:contain!important;flex:0 0 38px!important;margin-right:11px!important;opacity:1!important;visibility:visible!important;transition:transform .28s ease,filter .28s ease}
          .brand:hover .header-fox-img{transform:scale(1.02);filter:drop-shadow(0 0 8px rgba(255,90,0,.42))}
          @media(max-width:720px){.header-fox-img{width:30px!important;height:30px!important;flex-basis:30px!important;margin-right:8px!important}}
          </style>'''
          if 'id="v59-header-fox-img"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          PY
      - name: Verify insertion
        run: |
          grep -q 'header-fox-img' index.html
          grep -q 'assets/kz-fox-logo.png' index.html
      - name: Commit V59
        run: |
          git config user.name "fuxy-AI"
          git config user.email "fuxymaxi@gmail.com"
          git add index.html
          git commit -m "V59: show actual fox logo beside portfolio brand" || exit 0
          git push
